<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Locked</title>
<style>
  :root{
    --accent:#97f3ce; --text:#eef3f7; --muted:#8d9aab;
    --accent2:#7c96ff; --bg:#05070a; --panel:rgba(18,22,30,.80);
    --input:rgba(0,0,0,.34); --edge:rgba(255,255,255,.10); --danger:#ff8a8a;
    --buttonText:#0d1117; --radius:24px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  /* No pointer while the password prompt is up: the mouse has nothing to do here. */
  *,*::before,*::after{cursor:none!important}
  /* Once the prompt has stepped aside, the pointer follows the Hide cursor setting. */
  body.pointer,body.pointer *{cursor:default!important}
  body{
    color:var(--text); overflow:hidden;
    background:
      radial-gradient(900px 620px at 50% 32%, color-mix(in srgb,var(--accent) 14%,transparent), transparent 68%),
      radial-gradient(1100px 760px at 82% 88%, color-mix(in srgb,var(--accent2) 12%,transparent), transparent 70%),
      var(--bg);
    font:14px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
    display:grid; place-items:center; -webkit-user-select:none; user-select:none;
  }
  .clock{
    position:fixed; top:12%; left:0; right:0; text-align:center;
    font-weight:250; font-size:78px; letter-spacing:.02em; color:#dfe8f2;
    font-variant-numeric:tabular-nums; opacity:.92;
    text-shadow:0 8px 40px rgba(0,0,0,.5);
  }
  .clock small{display:block;margin-top:2px;font-size:15px;font-weight:500;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}

  .card{
    width:392px; padding:34px 34px 26px; text-align:center;
    background:var(--panel); border:1px solid var(--edge); border-radius:var(--radius);
    backdrop-filter:blur(26px) saturate(140%);
    box-shadow:0 40px 90px rgba(0,0,0,.55), 0 0 54px color-mix(in srgb,var(--accent) 10%,transparent), 0 1px 0 rgba(255,255,255,.05) inset;
    transition:opacity .45s ease, transform .45s cubic-bezier(.2,.8,.2,1);
    opacity:0;transform:translateY(10px);
  }
  body.ready .card{opacity:1;transform:none}
  /* After a while alone, the whole prompt steps aside instead of sitting there half typed. */
  body.ready .card.away{opacity:0;transform:translateY(12px);pointer-events:none;visibility:hidden}
  .card.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
  @keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(5px)}
    30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}

  .badge{
    width:58px;height:58px;margin:0 auto 16px;border-radius:50%;
    display:grid;place-items:center;
    background:color-mix(in srgb,var(--accent) 14%,transparent);
    border:1px solid color-mix(in srgb,var(--accent) 42%,transparent);
  }
  .badge svg{width:25px;height:25px;stroke:var(--accent);fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  h1{font-size:21px;font-weight:650;letter-spacing:-.01em}
  .who{margin-top:5px;color:var(--accent);font-size:13px;font-weight:600}
  .hint{margin-top:3px;color:var(--muted);font-size:12.5px}
  form{margin-top:20px}

  .field{position:relative;height:48px;border-radius:14px;background:var(--input);
    border:1px solid var(--edge);transition:border-color .16s, box-shadow .16s}
  .field:focus-within{border-color:color-mix(in srgb,var(--accent) 70%,transparent);
    box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 12%,transparent)}
  .field.disabled{opacity:.5}
  input{
    position:absolute; inset:0; width:100%; height:100%; padding:0 50px 0 18px;
    color:var(--text); background:transparent; border:0; border-radius:14px;
    font:16px/1 "Segoe UI",system-ui,sans-serif; letter-spacing:.28em; outline:none;
    caret-color:transparent;
  }
  input[type=text]{letter-spacing:.06em}
  input::-ms-reveal,input::-ms-clear{display:none}
  input::-webkit-credentials-auto-fill-button{visibility:hidden;display:none!important;pointer-events:none}
  input::placeholder{letter-spacing:normal;color:#5d6878}
  input::selection{background:transparent}

  /* Known length: one slot per character instead of the raw text. */
  .slots{position:absolute;inset:0 50px 0 18px;display:none;align-items:center;justify-content:center;
    gap:clamp(2px,calc(90px / var(--n,8)),9px);pointer-events:none}
  .slots i{width:clamp(4px,calc(170px / var(--n,8)),11px);aspect-ratio:1;border-radius:50%;
    border:1.5px solid color-mix(in srgb,var(--text) 26%,transparent);
    transition:background .12s, border-color .12s, transform .12s, box-shadow .12s}
  .slots i.on{background:var(--accent);border-color:var(--accent);transform:scale(1.08);
    box-shadow:0 0 10px color-mix(in srgb,var(--accent) 55%,transparent)}
  .field.slotted .slots{display:flex}
  .field.slotted input{color:transparent}
  .field.slotted input::placeholder{color:transparent}
  .field.revealed .slots{display:none}
  .field.revealed input{color:var(--text)}
  .field.checking .slots i.on{animation:pulse .5s ease-in-out infinite alternate}
  @keyframes pulse{to{opacity:.45;transform:scale(.86)}}
  /* Very long passwords get a filling line instead of dozens of dots. */
  .progress{position:absolute;left:14px;right:14px;bottom:6px;height:2px;border-radius:2px;
    background:color-mix(in srgb,var(--text) 10%,transparent);display:none;overflow:hidden}
  .progress b{display:block;height:100%;width:0;background:var(--accent);transition:width .12s}
  .field.long .progress,.field.revealed .progress{display:block}
  .field.long:not(.revealed) input{color:var(--text)}

  .eye{position:absolute;top:7px;right:7px;width:34px;height:34px;border-radius:11px;
    display:grid;place-items:center;pointer-events:none;
    background:color-mix(in srgb,var(--accent) 14%,transparent);
    color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 34%,transparent)}
  .field.revealed .eye{background:color-mix(in srgb,var(--accent) 26%,transparent);color:var(--text)}
  .eye svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .msg{min-height:18px;margin-top:13px;font-size:12.5px;color:var(--muted)}
  .msg.error{color:var(--danger)}
  .foot{margin-top:14px;font-size:11px;color:#5d6878}
  .foot kbd{font:inherit;color:#7d8898}

  .wake{
    position:fixed; left:0; right:0; bottom:9%; text-align:center;
    color:#6d7889; font-size:12.5px; opacity:0; transition:opacity .45s ease; pointer-events:none;
  }
  .wake.on{opacity:1}
</style>
<style id="pointerStyle"></style>
</head>
<body>
  <div class="clock"><span id="time">--:--</span><small id="date"></small></div>

  <div class="card" id="card">
    <div class="badge">
      <svg viewBox="0 0 24 24"><rect x="4" y="10.5" width="16" height="10.5" rx="3"/>
      <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.6" r="1.3" fill="currentColor" stroke="none"/></svg>
    </div>
    <h1 id="title">Welcome back</h1>
    <div class="who" id="who"></div>
    <div class="hint" id="hint">Enter your password to return to the desktop</div>
    <form id="form" autocomplete="off">
      <div class="field" id="field">
        <input id="pw" type="password" placeholder="Password" autocomplete="off"
               spellcheck="false" maxlength="128" autofocus>
        <div class="slots" id="slots" aria-hidden="true"></div>
        <div class="progress" aria-hidden="true"><b id="progress"></b></div>
        <span class="eye" id="eye" aria-hidden="true"></span>
      </div>
    </form>
    <div class="msg" id="msg"></div>
    <div class="foot" id="foot"></div>
  </div>

  <div class="wake" id="wake">Press any key to enter your password</div>

<script>
(() => {
  const send = m => window.chrome?.webview?.postMessage(m);
  const $ = id => document.getElementById(id);
  const pw = $('pw'), field = $('field'), slots = $('slots'), eye = $('eye');
  const msg = $('msg'), card = $('card'), wake = $('wake'), title = $('title'), who = $('who');

  const IDLE_HIDE_MS = 5000;
  const SLOT_LIMIT = 40;          // longer passwords show a filling line instead
  let returnTimer = null, idleTimer = null, cooldownTimer = null, checkTimer = null;
  let cooldownUntil = 0, away = false, revealed = false, checking = false;
  let expected = 0;               // stored password length; 0 when the app does not know it
  let hideCursor = true;          // the app's Hide cursor setting, for the idle screen
  let nativeWake = false, wakeKeyboard = true;
  const PALETTE_THEMES = [
    ['#85f2c8','#435dff','#05070a','rgba(14,23,27,.82)'],
    ['#ff8e61','#ffc05c','#100706','rgba(31,18,15,.84)'],
    ['#76c6ff','#42e9ed','#050913','rgba(12,22,35,.84)'],
    ['#cf83ff','#ff5c99','#0b0612','rgba(24,15,34,.84)'],
    ['#aede71','#31b875','#061008','rgba(16,28,18,.84)'],
    ['#bcc8df','#6f7f9e','#07090d','rgba(20,23,31,.84)'],
    ['#f7c867','#eb6532','#100b04','rgba(32,24,13,.84)'],
    ['#efa8cc','#9d91ff','#100711','rgba(33,18,32,.84)']
  ];
  const EYE_OPEN = '<svg viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.8"/></svg>';
  const EYE_SHUT = '<svg viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.7 5.2A10.7 10.7 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-3.1 4.1"/><path d="M6.6 6.8C3.9 8.7 2.5 12 2.5 12s3.5 7 9.5 7c1.7 0 3.1-.4 4.4-1"/></svg>';

  function setTheme(data) {
    const theme = PALETTE_THEMES[Math.max(0, Math.min(PALETTE_THEMES.length - 1, data.palette || 0))];
    const root = document.documentElement.style;
    root.setProperty('--accent', theme[0]);
    root.setProperty('--accent2', theme[1]);
    root.setProperty('--bg', theme[2]);
    root.setProperty('--panel', theme[3]);
    root.setProperty('--edge', 'color-mix(in srgb,' + theme[0] + ' 28%,rgba(255,255,255,.10))');
    root.setProperty('--input', 'color-mix(in srgb,' + theme[2] + ' 78%,black)');
    root.setProperty('--radius', Math.max(12, Math.min(30, Number(data.roundness || 18) + 8)) + 'px');
    root.setProperty('--buttonText', data.palette === 5 ? '#10141b' : '#0d1117');
    hideCursor = data.hideCursor !== false;
    nativeWake = data.nativeWake === true;
    wakeKeyboard = data.wakeKeyboard !== false;
    wake.textContent = wakeKeyboard ? 'Press any key or move the mouse to enter your password' : 'Move the mouse or click to enter your password';
    const length = Math.max(0, Math.min(128, Math.floor(Number(data.length) || 0)));
    if (length !== expected) { expected = length; pw.value = ''; }
    layout();
  }
  // The app's own pointer, used only while the prompt is away and Hide cursor is off.
  function setPointer(c) {
    const style = $('pointerStyle');
    if (!c || !c.on) { style.textContent = ''; return; }
    const plain = 'url("' + c.url1 + '") ' + c.x + ' ' + c.y;
    const sharp = 'image-set(url("' + c.url1 + '") 1x, url("' + c.url2 + '") 2x) ' + c.x + ' ' + c.y;
    style.textContent = 'body.pointer,body.pointer *{cursor:' + plain + ',default!important;cursor:' + sharp + ',default!important}';
  }
  function updatePointer() { document.body.classList.toggle('pointer', away && !hideCursor); }

  // With a known length the field shows one slot per character, stops at the last one
  // and submits by itself. Without it (a password from an older version) Enter submits.
  function layout() {
    pw.maxLength = expected || 128;
    if (pw.value.length > pw.maxLength) pw.value = pw.value.slice(0, pw.maxLength);
    field.classList.toggle('slotted', expected > 0 && expected <= SLOT_LIMIT);
    field.classList.toggle('long', expected > SLOT_LIMIT);
    slots.style.setProperty('--n', expected || 8);
    if (slots.childElementCount !== (expected <= SLOT_LIMIT ? expected : 0))
      slots.replaceChildren(...Array.from({ length: expected <= SLOT_LIMIT ? expected : 0 }, () => document.createElement('i')));
    pw.placeholder = expected ? '' : 'Password';
    $('foot').innerHTML = (expected ? 'Unlocks on the last character' : 'Press <kbd>Enter</kbd> to unlock') +
      ' · <kbd>Alt+F8</kbd> shows it · <kbd>Esc</kbd> clears';
    render();
  }
  function render() {
    const typed = pw.value.length;
    [...slots.children].forEach((slot, i) => slot.classList.toggle('on', i < typed));
    $('progress').style.width = (expected ? Math.min(100, typed * 100 / expected) : 0) + '%';
  }
  function setMessage(text, isError) {
    msg.textContent = text || '';
    msg.classList.toggle('error', !!isError);
  }
  function clearField() { pw.value = ''; render(); }
  function settle() {
    checking = false; pw.readOnly = false;
    field.classList.remove('checking');
    clearTimeout(checkTimer);
  }
  function submit() {
    if (checking) return;
    if (Date.now() < cooldownUntil || pw.disabled) { shake(); return; }
    if (!pw.value) { shake(); return; }
    if (expected && pw.value.length < expected) { shake(); setMessage('It unlocks on the last character', false); return; }
    checking = true; pw.readOnly = true;
    field.classList.add('checking');
    send('try:' + pw.value);
    // The app answers within milliseconds; never leave the field stuck if it does not.
    checkTimer = setTimeout(() => { settle(); clearField(); }, 4000);
  }
  // The whole prompt slides away after 5s alone, so a half-typed password never
  // sits on an abandoned screen. Accepted wake input brings it back, empty.
  function armIdle() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(hideCard, IDLE_HIDE_MS);
  }
  function hideCard() {
    if (away) return;
    away = true;
    settle(); clearField();
    setPasswordVisible(false);
    setMessage('', false);
    card.classList.add('away');
    pw.blur(); card.inert = true;
    wake.classList.add('on');
    updatePointer();
    send('idle');
    returnTimer = setTimeout(() => send('rest'), 10000);
  }
  function wakeCard() {
    clearTimeout(returnTimer);
    if (away) {
      away = false;
      card.inert = false;
      card.classList.remove('away');
      wake.classList.remove('on');
      updatePointer();
    }
    armIdle();
    keepFocus();
  }
  // The password field is the only thing that can hold focus on this screen.
  function keepFocus() { if (!away && !pw.disabled && document.activeElement !== pw) pw.focus({ preventScroll: true }); }
  function setPasswordVisible(visible) {
    revealed = visible;
    pw.type = visible ? 'text' : 'password';
    field.classList.toggle('revealed', visible);
    eye.innerHTML = visible ? EYE_SHUT : EYE_OPEN;
  }
  function shake() {
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
  }
  function tickCooldown() {
    const left = Math.ceil((cooldownUntil - Date.now()) / 1000);
    if (left > 0) {
      pw.disabled = true; field.classList.add('disabled');
      setMessage('Too many attempts · wait ' + left + 's', true);
    } else {
      clearInterval(cooldownTimer); cooldownTimer = null;
      pw.disabled = false; field.classList.remove('disabled');
      setMessage('', false); keepFocus();
    }
  }
  function tickClock() {
    const now = new Date();
    $('time').textContent = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    $('date').textContent = now.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
  }

  pw.addEventListener('input', e => {
    setMessage('', false); armIdle(); render();
    if (!e.isComposing && expected && pw.value.length >= expected) submit();
  });
  pw.addEventListener('compositionend', () => { render(); if (expected && pw.value.length >= expected) submit(); });
  pw.addEventListener('blur', () => setTimeout(keepFocus, 0));
  ['copy', 'cut', 'dragstart', 'drop'].forEach(type => pw.addEventListener(type, e => e.preventDefault()));
  // The mouse only wakes the prompt. Nothing on this screen can be clicked, selected,
  // scrolled or dragged, and focus never leaves the password field.
  ['mousedown', 'mouseup', 'click', 'dblclick', 'auxclick', 'contextmenu', 'wheel', 'dragstart', 'selectstart'].forEach(type =>
    document.addEventListener(type, e => { e.preventDefault(); e.stopPropagation(); if (!nativeWake) wakeCard(); }, { capture: true, passive: false }));
  document.addEventListener('mousemove', () => { if (!nativeWake) wakeCard(); });
  document.addEventListener('keydown', e => {
    if (away && !wakeKeyboard) { e.preventDefault(); e.stopPropagation(); return; }
    if (e.key === 'Tab') { e.preventDefault(); wakeCard(); return; }
    if (e.altKey && e.key === 'F8') { e.preventDefault(); wakeCard(); setPasswordVisible(!revealed); return; }
    if (e.key === 'Escape') {
      e.preventDefault(); wakeCard();
      if (!checking) clearField();
      setMessage('', false); return;
    }
    if (e.key === 'Enter') { e.preventDefault(); wakeCard(); submit(); return; }
    wakeCard();
  }, true);
  $('form').addEventListener('submit', e => { e.preventDefault(); submit(); });

  window.chrome?.webview?.addEventListener('message', e => {
    const data = e.data;
    if (typeof data !== 'string') return;
    if (data === 'reveal') {
      document.body.classList.add('ready');
      settle(); clearField(); wakeCard(); return;
    }
    if (data === 'wake') { wakeCard(); return; }
    if (data.startsWith('theme:')) { try { setTheme(JSON.parse(data.slice(6))); } catch {} return; }
    if (data.startsWith('cursor:')) { try { setPointer(JSON.parse(data.slice(7))); } catch {} return; }
    if (data.startsWith('wrong:')) {
      const attempts = parseInt(data.slice(6), 10) || 0;
      settle(); wakeCard(); clearField();
      title.textContent = 'Screen locked';
      setMessage('Wrong password · attempt ' + attempts, true);
      shake();
    } else if (data.startsWith('cooldown:')) {
      settle(); wakeCard(); clearField();
      cooldownUntil = Date.now() + (parseInt(data.slice(9), 10) || 0);
      if (!cooldownTimer) cooldownTimer = setInterval(tickCooldown, 250);
      tickCooldown();
    } else if (data.startsWith('user:')) {
      who.textContent = data.slice(5);
    }
  });

  setPasswordVisible(false);
  layout();
  window.addEventListener('load', () => { keepFocus(); armIdle(); send('ready'); });
  tickClock(); setInterval(tickClock, 1000);
  setInterval(keepFocus, 900);
})();
</script>
</body>
</html>
